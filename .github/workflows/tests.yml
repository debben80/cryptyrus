name: Cryptyrus CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
    
permissions:
  contents: read

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright & Dependencies
        run: |
          npm init -y
          npm i -D @playwright/test
          npx playwright install --with-deps chromium

      - name: Run E2E and Standalone Tests
        run: npx playwright test tests/cryptyrus.spec.mjs --browser=chromium
